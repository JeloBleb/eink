[build]
target = "xtensa-esp32s3-none-elf"   # always cross-compile for the S3; "none" = no OS

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"  # makes `cargo run` = flash board + open serial monitor
rustflags = ["-C", "link-arg=-nostartfiles", "-C", "link-arg=-Wl,-Tlinkall.x"]

[unstable]
build-std = ["core"]                 # no prebuilt std for Xtensa; build `core` from source

[alias]
r = "run --release"
b = "build --release"
